<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Test World — a premium Telegram Mini App." />
  <title>Test World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="intro" class="intro" aria-label="Welcome to Test World">
    <div class="intro-frame">
      <span id="introText" class="intro-text"></span><span class="typing-cursor" aria-hidden="true"></span>
      <svg class="frame-svg" viewBox="0 0 600 112" preserveAspectRatio="none" aria-hidden="true">
        <path class="frame-path" d="M12 1 H588 Q599 1 599 12 V100 Q599 111 588 111 H12 Q1 111 1 100 V12 Q1 1 12 1 Z"/>
      </svg>
    </div>
    <div class="intro-caption">A WORLD OF POSSIBILITIES</div>
  </div>

  <div id="app" class="app-shell" aria-hidden="true">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Test World home" data-page="home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 36 36" fill="none">
            <path d="M18 2.8 32 10.4v15.2L18 33.2 4 25.6V10.4L18 2.8Z" stroke="currentColor" stroke-width="1.5"/>
            <path d="m11 13 7-4 7 4v10l-7 4-7-4V13Z" stroke="currentColor" stroke-width="1.5"/>
            <path d="M18 9v18M11 13l14 10M25 13 11 23" stroke="currentColor" stroke-width="1" opacity=".55"/>
          </svg>
        </span>
        <span class="brand-name">Test<span>World</span></span>
      </a>
      <div id="ton-connect" class="wallet-mount" aria-label="TON wallet connection"></div>
    </header>

    <main class="main-content">
      <section id="homePage" class="page active" aria-label="Home">
        <div class="balance-area">
          <article class="balance-card" aria-label="Test World balance">
            <div class="balance-card-top">
              <span class="balance-label">YOUR BALANCE</span>
              <span class="balance-token">TW</span>
            </div>
            <div class="balance-amount"><span id="balanceAmount">0.00</span><span class="balance-unit">TW</span></div>
            <div class="balance-card-bottom">
              <span>TEST WORLD</span>
              <span class="balance-live-dot" aria-hidden="true"></span>
            </div>
          </article>

          <button id="claimButton" class="world-logo-button" type="button" aria-label="Tap Test World logo to add 10 TW">
            <span class="world-logo-mark" aria-hidden="true">
              <svg viewBox="0 0 52 52" fill="none">
                <path d="M26 2.8 48 14.4v23.2L26 49.2 4 37.6V14.4L26 2.8Z" stroke="currentColor" stroke-width="1.6"/>
                <path d="m16 18 10-5.4L36 18v16L26 39.4 16 34V18Z" stroke="currentColor" stroke-width="1.5"/>
                <path d="M26 12.6v26.8M16 18l20 16M36 18 16 34" stroke="currentColor" stroke-width="1" opacity=".55"/>
              </svg>
            </span>
            <span class="world-logo-name">TEST <b>WORLD</b></span>
            <span class="world-logo-hint">TAP TO ADD <b>+10 TW</b></span>
          </button>
        </div>
      </section>
      <section id="profilePage" class="page profile-page" aria-label="Profile">
        <article class="account-card">
          <div class="account-card-heading">
            <span class="account-kicker">YOUR ACCOUNT</span>
            <span class="account-mark">TW</span>
          </div>
          <div class="account-identity">
            <div id="profileAvatar" class="profile-avatar" aria-hidden="true">U</div>
            <div class="account-user">
              <strong id="profileUsername">Telegram User</strong>
              <span>Test World Member</span>
            </div>
          </div>
          <div class="account-divider"></div>
          <div class="account-details">
            <div class="account-detail">
              <span>TELEGRAM ID</span>
              <strong id="profileTelegramId">—</strong>
            </div>
            <div class="account-detail balance-detail">
              <span>BALANCE</span>
              <strong><span id="profileBalance">0.00</span> <small>TW</small></strong>
            </div>
          </div>
        </article>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" type="button" data-page="home" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m3.5 10.4 8.5-7 8.5 7v9.1a1 1 0 0 1-1 1h-5.2v-6.1H9.7v6.1H4.5a1 1 0 0 1-1-1v-9.1Z" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-item" type="button" data-page="profile">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.55"/><path d="M4.8 20c.8-3.2 3.4-5 7.2-5s6.4 1.8 7.2 5" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/></svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
